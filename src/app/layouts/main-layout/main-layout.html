<div class="admin-app" [class.admin-app--collapsed]="sidebarCollapsed()">
  <div class="admin-overlay" [class.admin-overlay--visible]="sidebarOpen()" (click)="closeSidebar()" aria-hidden="true"></div>

  <aside class="admin-sidebar" [class.admin-sidebar--open]="sidebarOpen()">
    <button type="button" class="admin-collapse" (click)="toggleSidebarWidth()" [attr.aria-label]="sidebarCollapsed() ? 'Perlebar sidebar' : 'Ciutkan sidebar'" [attr.title]="sidebarCollapsed() ? 'Perlebar sidebar' : 'Ciutkan sidebar'">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>

    <a [routerLink]="homePath()" class="admin-brand" (click)="closeSidebar()">
      <span class="admin-brand__mark">IB</span>
      <span class="admin-brand__text"><strong>Inventaris</strong><small>Jurusan DKV</small></span>
    </a>

    <nav class="admin-nav" aria-label="Navigasi utama">
      <p class="admin-nav__caption">MENU UTAMA</p>
      @for (item of mainMenu(); track item.path) {
        <a [routerLink]="item.path" routerLinkActive="admin-nav__link--active" [routerLinkActiveOptions]="{ exact: item.path === '/dashboard' }" (click)="closeSidebar()" class="admin-nav__link" [attr.title]="sidebarCollapsed() ? item.label : null">
          <span class="admin-nav__icon" [innerHTML]="item.icon"></span><span class="admin-nav__label">{{ item.label }}</span>
        </a>
      }

      @if (settingsMenu().length > 0) {
        <div class="admin-nav__divider"></div>
        <p class="admin-nav__caption">PENGATURAN</p>
        @for (item of settingsMenu(); track item.path) {
          <a [routerLink]="item.path" routerLinkActive="admin-nav__link--active" (click)="closeSidebar()" class="admin-nav__link" [attr.title]="sidebarCollapsed() ? item.label : null">
            <span class="admin-nav__icon" [innerHTML]="item.icon"></span><span class="admin-nav__label">{{ item.label }}</span>
          </a>
        }
      }
    </nav>

    <div class="admin-profile">
      <span class="admin-avatar" aria-hidden="true">{{ initials() }}</span>
      <span class="admin-profile__text">
        <strong>{{ fullName() }}</strong>
        <small>{{ roleLabel() }}</small>
      </span>
      <button type="button" class="admin-logout" (click)="onLogout()" aria-label="Keluar dari akun" title="Keluar">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></svg>
      </button>
    </div>
  </aside>

  <div class="admin-workspace">
    <main class="admin-content">

      <router-outlet />
    </main>
  </div>
</div>
